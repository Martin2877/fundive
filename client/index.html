<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeepLog · 深蓝手账</title>
<meta name="description" content="DeepLog 深蓝手账 — 写实潜水模拟与在线手账：洞潜 · 单人/组队 · 拍照图鉴 · 平行宇宙 | Realistic dive simulator &amp; journal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=Share+Tech+Mono&display=swap">
<style>
:root{--ink:#e6f3f1;--dim:rgba(214,236,232,.62);--lagoon:#7fe9ea;--line:rgba(214,236,232,.18);--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#010405;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#010405;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible{outline:2px solid var(--lagoon);outline-offset:3px}
.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:10}
.panel{background:rgba(2,10,12,.72);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:28px 32px;max-width:min(720px,calc(100vw - 40px));max-height:calc(100vh - 40px);overflow-y:auto}
.k{font-size:11px;letter-spacing:.34em;color:var(--lagoon)}
h1.title{margin:8px 0 4px;font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,64px);line-height:1.1;letter-spacing:.04em;color:#f1f8f6}
.sub{font-size:14px;line-height:1.8;color:var(--dim);max-width:34em}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:14px;border:1px solid var(--line);background:rgba(3,14,16,.55);font-size:15px;letter-spacing:.04em;transition:transform .15s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(127,233,234,.55);background:rgba(6,26,28,.7)}
.btn.primary{border-color:rgba(127,233,234,.5);background:linear-gradient(100deg,rgba(20,90,92,.55),rgba(3,14,16,.55));font-weight:700}
.btn.small{padding:6px 14px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.maps{display:grid;gap:7px;margin:10px 0;height:32vh;overflow-y:auto;padding-right:4px;align-content:start}
#trainbox{height:32vh;overflow-y:auto;margin:10px 0}
.map{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;text-align:left;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,14,16,.55);transition:transform .15s,border-color .2s,background .2s;width:100%}
.map:hover{transform:translateX(3px);border-color:rgba(127,233,234,.55);background:rgba(6,26,28,.7)}
.map.sel{border-color:var(--lagoon);box-shadow:0 0 30px rgba(60,220,220,.12)}
.map .n{font-size:15px;font-weight:700}.map .n small{color:var(--dim);font-weight:400;margin-left:8px;font-size:11.5px}
.map .d{display:none;grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.55}
.map.sel .d{display:block}
.map .tag{font-size:9.5px;letter-spacing:.24em;color:var(--lagoon);grid-row:1;grid-column:1;align-self:center}
.map .diff{font-size:11px;color:#ffd27f;align-self:start;grid-column:3;grid-row:1}
input[type=text]{font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 14px;letter-spacing:.12em}
input[type=text]:focus{outline:none;border-color:var(--lagoon)}
.seedrow{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--dim);margin:8px 0}
.disc{display:flex;gap:8px;margin:12px 0 0}
.disc button{font-size:12px;letter-spacing:.1em;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.disc button.on{border-color:var(--lagoon);color:var(--lagoon)}
.disc button[disabled]{opacity:.45;cursor:default}
/* —— 主菜单：标题栏 + 系统入口 —— */
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:6px}
.m-head .title{margin-top:6px}
.m-sys{display:flex;gap:8px;padding-top:10px;flex-shrink:0}
/* —— 主菜单：大分区卡片轮播（一次一张，邻卡只露边缘） —— */
.car{position:relative;margin:8px 0 2px}
.car-view{overflow:hidden;border-radius:18px}
.car-track{display:flex;transition:transform .38s cubic-bezier(.3,.7,.3,1)}
.dc{position:relative;flex:0 0 52%;margin:0 2%;display:grid;justify-items:center;gap:4px;text-align:center;padding:20px 14px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(6,26,28,.85),rgba(2,10,12,.6));opacity:.42;filter:blur(1.4px) saturate(.7) brightness(.82);transform:scale(.94);transition:opacity .35s,transform .35s,filter .35s,border-color .25s,box-shadow .25s}
.dc.on{opacity:1;filter:none;transform:scale(1);border-color:var(--ac,#7fe9ea);box-shadow:0 10px 44px color-mix(in srgb,var(--ac,#7fe9ea) 20%,transparent)}
.dc:not(.on):hover{opacity:.75;filter:blur(.5px) saturate(.85)}
.dc-ic{font-size:30px;line-height:1.1;color:var(--ac,#7fe9ea)}
.dc-n{font-size:23px;font-weight:800;letter-spacing:.1em;font-family:var(--serif)}.dc-n small{display:block;color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.3em;margin-top:2px}
.dc-s{font-size:11.5px;color:var(--dim);letter-spacing:.1em}
.dc-c{position:absolute;top:13px;right:15px;font-size:10px;letter-spacing:.12em;color:var(--ac,#7fe9ea)}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(2,10,12,.75);color:var(--dim);font-size:22px;line-height:1;display:grid;place-items:center;transition:color .2s,border-color .2s}
.car-nav:hover{color:var(--lagoon);border-color:rgba(127,233,234,.55)}
.car-nav.prev{left:2px}.car-nav.next{right:2px}
.car-dots{display:flex;justify-content:center;gap:7px;margin:8px 0 2px}
.car-dots button{width:7px;height:7px;border-radius:50%;background:rgba(214,236,232,.22);padding:0;transition:background .2s,transform .2s}
.car-dots button.on{background:var(--lagoon);transform:scale(1.35)}
/* —— 主菜单：宇宙折叠条 —— */
.uniline{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:9px;font-size:12px;min-height:1.6em}
.uni-obj{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.uni-obj b{color:var(--lagoon)}
.uni-seed{display:flex;align-items:center;gap:8px;flex-shrink:0;color:var(--dim)}
.uni-seed b{color:var(--ink);letter-spacing:.04em}
.uni-seed code{color:var(--lagoon);letter-spacing:.12em;font-size:11px}
.uni-tog{font-size:11px;color:var(--lagoon);letter-spacing:.08em;padding:3px 10px;border:1px solid rgba(127,233,234,.3);border-radius:999px}
.uni-tog:hover{border-color:var(--lagoon)}
.uni-more{border:1px dashed var(--line);border-radius:12px;padding:4px 14px 10px;margin-top:8px}
/* —— 主菜单：主操作 + 关于 —— */
.m-cta{display:flex;margin-top:12px}
.m-cta .btn.big{flex:1;justify-content:center;padding:14px 22px;font-size:16.5px;letter-spacing:.12em}
.m-about{margin-top:10px}
.m-about summary{cursor:pointer;font-size:11px;color:var(--dim);letter-spacing:.1em}
.m-about summary:hover{color:var(--lagoon)}
.cm{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:rgba(2,10,12,.4)}
.cm b{font-size:13px}.cm b small{color:var(--dim);font-weight:400;margin-left:8px;font-size:10.5px}
.cm-s{color:#ffd27f;font-size:11px;letter-spacing:.08em;text-align:right}
.cm i{grid-column:1/-1;font-style:normal;font-size:11px;color:var(--dim);line-height:1.5}
/* —— 出口方位标记（水下 HUD） —— */
#exitmk{position:fixed;left:0;top:0;z-index:5;pointer-events:none;transform:translate(-50%,-140%);font-size:11.5px;letter-spacing:.1em;color:#9ff4f4;text-shadow:0 1px 10px #000;background:rgba(2,12,14,.55);border:1px solid rgba(127,233,234,.45);border-radius:999px;padding:4px 12px;white-space:nowrap;transition:opacity .3s}
#exitmk .d{color:var(--ink);font-weight:700}
#exitmk.hot{border-color:#ffd27f;color:#ffe6b0;animation:exmk 1.6s ease-in-out infinite}
@keyframes exmk{0%,100%{box-shadow:0 0 0 rgba(255,210,127,0)}50%{box-shadow:0 0 18px rgba(255,210,127,.45)}}
.uni{border:1px dashed var(--line);border-radius:14px;padding:8px 14px;margin-top:6px}
.uni b{color:var(--ink);letter-spacing:.06em}
.why summary{cursor:pointer;font-size:12px;color:var(--lagoon);margin:2px 0}
.why .sub{max-width:none}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:12px;line-height:1.8;color:var(--dim)}
.story{border-left:2px solid #ffd27f;padding:2px 12px;margin:8px 0;font-size:12.5px;line-height:1.8;color:var(--ink)}
.story b{color:#ffd27f;letter-spacing:.08em}
.story .dim{color:var(--dim);font-size:11.5px}
.seedrow code{color:var(--lagoon);letter-spacing:.14em}
/* —— HUD —— */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
#hud .corner{position:absolute;text-shadow:0 1px 10px rgba(0,0,0,.9)}
#hud .tl{top:20px;left:22px}
#hud .tr{top:20px;right:22px;text-align:right}
#hud .br{right:22px;bottom:20px;text-align:right}
#hud .bl{left:22px;bottom:20px}
#hud .panel{display:inline-grid;gap:4px;min-width:170px;background:rgba(3,14,17,.55);border:1px solid var(--line);border-radius:14px;padding:10px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hud .tr .panel,#hud .br .panel{justify-items:end}
#hud .lbl{font-size:10px;letter-spacing:.26em;color:var(--dim)}
#hud .big{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:44px;line-height:1.05;color:var(--ink)}
#hud .big small{font-size:15px;color:var(--dim);margin-left:4px}
#hud .sub{font-size:12px;color:var(--dim);letter-spacing:.04em;min-height:1em}
#hud .prow{display:flex;align-items:baseline;gap:8px}
#hud .prow b{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:26px;font-weight:400;color:var(--ink)}
#hud .prow small{font-size:11px;color:var(--dim)}
#hud .gbar{position:relative;width:196px;height:7px;border-radius:4px;background:rgba(214,236,232,.12)}
#hud .gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#7fe9ea;transition:width .3s}
#hud .gbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ffb27f;border-radius:1px}
#hud .warn{color:#ffb27f}
#hud .bad{color:#ff7f7f}
#hud #obj{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;letter-spacing:.14em;color:var(--ink);background:rgba(2,10,12,.4);border:1px solid var(--line);border-radius:999px;padding:6px 18px}
#hud #cmp{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:280px;height:22px;overflow:hidden;background:rgba(2,10,12,.45);border:1px solid var(--line);border-radius:999px}
#hud #cmp .ct{position:absolute;inset:0}
#hud #cmp .ctick{position:absolute;top:3px;left:0;font-size:10.5px;letter-spacing:.1em;color:var(--dim);transform:translateX(-999px)}
#hud #cmp .ctick[data-d="0"]{color:var(--ink);font-weight:700}
#hud #cmp .cway{position:absolute;top:3px;left:-5px;font-size:11px;color:#ffd27f;text-shadow:0 0 8px #000}
#hud #cmp .ccaret{position:absolute;top:1px;left:50%;width:1.5px;height:8px;background:var(--ink);transform:translateX(-50%)}
#hud #cmp .cdeg{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;letter-spacing:.15em;color:var(--lagoon)}
#hud #obj b{color:var(--lagoon)}
#hud #lineinfo{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;color:var(--dim)}
#hud #hint{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--ink);text-shadow:0 1px 12px #000;background:rgba(2,10,12,.5);padding:6px 16px;border-radius:999px;opacity:0;transition:opacity .3s}
#hud #hint.show{opacity:1}
#hud #breath{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.5em;color:rgba(214,236,232,.35)}
#vig{display:none}
#mask{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;background-repeat:no-repeat;background-size:cover;background-position:center}
body.diving #mask{opacity:1}
#narco{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(20,0,40,.5) 100%);transition:opacity 1s}
/* 取景器 */
#finder{position:fixed;inset:0;pointer-events:none;z-index:6}
#finder .frame{position:absolute;inset:14% 20%;border:1.5px solid rgba(127,233,234,.75);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
#finder .cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#finder .cross:before,#finder .cross:after{content:"";position:absolute;background:rgba(127,233,234,.9)}
#finder .cross:before{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%)}
#finder .cross:after{top:50%;left:0;height:1.5px;width:100%;transform:translateY(-50%)}
#finder .meta{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--ink)}
#finder .film{position:absolute;top:12%;right:21.5%;font-size:11px;letter-spacing:.2em;color:var(--dim)}
/* 触屏控制 */
#touch{position:fixed;inset:0;pointer-events:none;z-index:7}
#stick{position:absolute;left:26px;bottom:90px;width:110px;height:110px;border-radius:50%;border:1.5px solid var(--line);background:rgba(2,10,12,.3);pointer-events:auto}
#stick .nub{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(127,233,234,.25);border:1px solid var(--lagoon);transform:translate(-50%,-50%)}
.tbtn{position:absolute;width:62px;height:62px;border-radius:50%;border:1.5px solid var(--line);background:rgba(2,10,12,.45);color:var(--ink);font-size:11px;letter-spacing:.1em;pointer-events:auto;display:grid;place-items:center}
.tbtn:active{background:rgba(127,233,234,.3)}
/* 计划/结算表格 */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.plan-grid .cell{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.plan-grid .cell .v{font-family:"Share Tech Mono",monospace;font-size:24px;color:var(--ink)}
.plan-grid .cell .l{font-size:10.5px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.flavor{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.flavor span{font-size:11px;letter-spacing:.12em;color:var(--lagoon);border:1px solid rgba(127,233,234,.3);border-radius:999px;padding:3px 10px}
/* 结局卡片 */
.endcard{width:min(400px,86vw);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#06181b,#010a0c);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.endcard .top{padding:22px 26px;border-bottom:1px solid var(--line)}
.endcard .top .r{font-size:10px;letter-spacing:.4em;color:var(--lagoon)}
.endcard .top h2{margin:6px 0 0;font-family:var(--serif);font-size:30px;font-weight:900;color:#f1f8f6}
.endcard .bd{padding:18px 26px 24px;font-size:13.5px;line-height:1.9;color:var(--ink)}
.endcard .bd .hint{margin-top:12px;font-size:12px;color:var(--dim);border-left:2px solid var(--lagoon);padding-left:10px}
.endcard.bad .top h2{color:#ffb3a8}
/* 图鉴 */
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.codex .it{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:96px;background:rgba(3,14,16,.5)}
.codex .it .n{font-size:13.5px;font-weight:700}
.codex .it .e{font-size:10px;color:var(--dim);font-style:italic;margin-top:2px}
.codex .it .stars{color:#ffd27f;font-size:11px;margin-top:6px;letter-spacing:.1em}
.codex .it .d{font-size:11px;color:var(--dim);line-height:1.5;margin-top:6px}
.codex .it.lock{opacity:.35}
.codex .it img{width:100%;border-radius:8px;margin-bottom:6px;display:block}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px;max-height:44vh;overflow-y:auto}
.album .ph{position:relative}
.album .ph img{width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.album .ph .c{position:absolute;left:6px;bottom:6px;font-size:9.5px;color:var(--ink);text-shadow:0 1px 6px #000}
/* 大厅 */
.lobby-list{display:grid;gap:8px;margin:12px 0}
.lobby-list .p{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.lobby-list .p .dot{width:8px;height:8px;border-radius:50%;background:#666}
.lobby-list .p.rdy .dot{background:var(--lagoon);box-shadow:0 0 8px var(--lagoon)}
.lobby-list .p .host{font-size:10px;color:var(--lagoon);letter-spacing:.2em;margin-left:auto}
.diving .mute{display:none}
.mute{position:fixed;right:18px;top:16px;z-index:20;background:rgba(2,10,12,.4);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.loading-txt{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.3em;color:var(--dim);z-index:30}
.talk{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);font-size:clamp(16px,2.4vw,22px);color:var(--ink);text-shadow:0 2px 16px #000;letter-spacing:.08em;opacity:0;transition:opacity .4s;z-index:8;text-align:center}
.talk.show{opacity:1}
#chatlog{position:fixed;left:22px;bottom:110px;z-index:6;display:grid;gap:4px;pointer-events:none}
#chatlog .msg{font-size:12px;color:var(--ink);text-shadow:0 1px 8px #000;background:rgba(2,10,12,.45);padding:4px 12px;border-radius:999px;width:fit-content}
/* —— 教学：考核面板 —— */
#trainer{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:6;width:min(300px,40vw);pointer-events:none;font-variant-numeric:tabular-nums}
#trainer .t-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.14em;color:var(--lagoon);text-shadow:0 1px 8px #000;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
#trainer .t-steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:11.5px;color:var(--dim)}
#trainer .t-steps li{display:flex;gap:7px;align-items:baseline;opacity:.55}
#trainer .t-steps li.done{opacity:.9;color:var(--ink)}
#trainer .t-steps li.done span{color:var(--lagoon)}
#trainer .t-steps li.cur{opacity:1;color:var(--ink)}
#trainer .t-steps li.cur span{color:#ffd27f}
#trainer .t-steps li em{font-style:normal;font-size:10px;color:var(--lagoon);margin-left:auto}
#t-now{margin-top:10px;font-size:14.5px;color:var(--ink);text-shadow:0 1px 10px #000;line-height:1.6}
#t-now em{font-style:normal;color:var(--lagoon);font-size:12px}
.t-barwrap{height:3px;background:rgba(214,236,232,.15);border-radius:2px;margin-top:8px;overflow:hidden}
#t-bar{height:100%;width:0;background:var(--lagoon);border-radius:2px;transition:width .12s}
#t-po2{margin-top:8px;font-family:"Share Tech Mono",monospace;font-size:15px;color:var(--ink);text-shadow:0 1px 8px #000}
#t-po2.alarm{color:#ff7f7f;animation:blink .5s steps(2) infinite}
#trainer .t-steps li.flash{animation:stepok .6s ease-out}
@keyframes stepok{0%{background:rgba(127,233,234,.35)}100%{background:transparent}}
#trainer .t-live{font-size:11px;color:var(--lagoon);margin-top:4px;font-family:"Share Tech Mono",monospace}
#trainer .t-live.bad{color:#ff9f8f}
#holdbreath{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(4,10,14,.75) 100%)}
@keyframes blink{50%{opacity:.25}}
/* —— 键位表 —— */
#keys{position:fixed;inset:0;display:grid;place-items:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .18s;background:rgba(0,4,5,.45)}
#keys.show{opacity:1}
#keys .kb{background:rgba(2,10,12,.88);border:1px solid var(--line);border-radius:18px;padding:22px 28px;width:min(620px,92vw);backdrop-filter:blur(10px)}
#keys .kg{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-top:10px;font-size:13px;line-height:1.9}
#keys .kg b{color:var(--lagoon);letter-spacing:.2em;font-size:12px;padding-top:3px}
#keys .kg span{color:var(--ink)}
/* —— 面镜进水 / 摘面镜 —— */
#maskw{position:fixed;left:0;right:0;bottom:0;height:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(180deg,rgba(60,160,190,.08) 0%,rgba(30,110,150,.38) 18%,rgba(8,60,95,.55) 100%);
  border-top:2px solid rgba(180,235,255,.5);box-shadow:0 -6px 24px rgba(120,220,255,.18) inset}
#maskw::before{content:"";position:absolute;top:-7px;left:0;right:0;height:12px;
  background:radial-gradient(circle at 12px -4px,transparent 9px,rgba(180,235,255,.4) 10px,transparent 11px) repeat-x;background-size:26px 12px;animation:wl 1.4s linear infinite}
@keyframes wl{to{background-position-x:26px}}
#maskoff{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s;
  backdrop-filter:blur(4px) saturate(1.15);-webkit-backdrop-filter:blur(4px) saturate(1.15);
  background:radial-gradient(ellipse at center,rgba(40,120,150,.12),rgba(6,40,60,.34))}
/* —— 课程表 —— */
.course-list{display:grid;gap:14px;margin:16px 0;max-height:52vh;overflow-y:auto;padding-right:4px}
.course{border:1px solid var(--line);border-radius:16px;padding:14px 18px;background:rgba(3,14,16,.55)}
.course .c-head{display:flex;justify-content:space-between;align-items:baseline}
.course .c-name{font-size:17px;font-weight:700}.course .c-name small{color:var(--dim);font-weight:400;margin-left:8px;font-size:11.5px}
.course .c-stars{color:#ffd27f;font-size:12px;letter-spacing:.12em}
.course .c-desc{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.course .c-kit{font-size:11px;color:var(--lagoon);letter-spacing:.08em;margin-top:6px}
.c-lessons{display:grid;gap:6px;margin-top:10px}
.lesson{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(2,10,12,.4);transition:border-color .15s,background .15s;width:100%}
.lesson:hover{border-color:rgba(127,233,234,.55);background:rgba(6,26,28,.7)}
.lesson .ln{font-size:13.5px;font-weight:700}
.lesson .ls{font-size:11px;color:#ffd27f;text-align:right}
.lesson .ld{grid-column:1/-1;font-size:11px;color:var(--dim);line-height:1.5}
.lesson.done .ls{color:var(--lagoon)}
.steps-table{width:min(400px,86vw);border-collapse:collapse;font-size:12px;color:var(--dim)}
.steps-table th{font-size:10px;letter-spacing:.2em;color:var(--dim);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.steps-table td{padding:4px 8px;border-bottom:1px solid rgba(214,236,232,.07)}
.steps-table td.bad,.steps-table .bad{color:#ff9f8f}
/* —— 体感小人 —— */
#avatar{position:fixed;left:20px;bottom:104px;width:150px;height:178px;z-index:5;pointer-events:none}
#avatar canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:14px;background:rgba(2,10,12,.35)}
#avatar .av-lbl{position:absolute;top:5px;left:10px;font-size:9px;letter-spacing:.34em;color:var(--dim)}
@media (max-width:640px){
  .panel{padding:20px 18px}
  #hud .big{font-size:30px}
  #hud .panel{min-width:120px;padding:7px 11px}
  #hud .gbar{width:130px}
  #hud .prow b{font-size:18px}
  #hud .br{right:12px;bottom:14px}
  #hud .tr{top:12px;right:12px}
  #hud .tl{top:12px;left:12px}
  #hud .bl{left:12px;bottom:14px}
  #finder .frame{inset:16% 10%}
  h1.title{font-size:34px}
  .dc{flex-basis:72%;margin:0 2%}
  .m-head{flex-direction:column;gap:6px}
  .m-sys{padding-top:0}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mask"></div><div id="vig"></div><div id="narco"></div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
